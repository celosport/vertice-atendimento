<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de WhatsApp | Vértice</title>
<style>
  :root { --verde: #075e54; --balao-robo: #ffffff; --balao-cliente: #dcf8c6; --fundo: #e5ddd5; --texto: #111; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #d8d8d8; color: var(--texto); min-height: 100dvh; display: grid; place-items: center; padding: 12px; }
  .celular { width: min(100%, 420px); height: min(92dvh, 760px); background: var(--fundo); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  header { background: var(--verde); color: #fff; padding: 12px 14px; display: grid; gap: 8px; }
  header h1 { margin: 0; font-size: 1rem; }
  header .linha { display: flex; gap: 8px; flex-wrap: wrap; }
  header select, header input { font: inherit; font-size: .85rem; padding: 6px 8px; border-radius: 8px; border: 0; min-width: 0; flex: 1 1 140px; }
  .aviso { background: #fff3cd; color: #5c4a00; font-size: .75rem; padding: 6px 12px; }
  #conversa { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .balao { max-width: 82%; padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; font-size: .92rem; box-shadow: 0 1px 1px rgba(0,0,0,.12); }
  .robo { background: var(--balao-robo); align-self: flex-start; border-top-left-radius: 2px; }
  .cliente { background: var(--balao-cliente); align-self: flex-end; border-top-right-radius: 2px; }
  form { display: flex; gap: 8px; padding: 10px; background: #f0f0f0; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  form input { flex: 1; font: inherit; padding: 10px 12px; border-radius: 20px; border: 1px solid #ccc; min-width: 0; }
  form button { font: inherit; font-weight: 600; background: var(--verde); color: #fff; border: 0; border-radius: 20px; padding: 0 16px; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #25d366; outline-offset: 2px; }
</style>
</head>
<body>
<main class="celular">
  <header>
    <h1>Simulador de WhatsApp</h1>
    <div class="linha">
      <select id="negocio" aria-label="Negócio"></select>
      <input id="numero" value="5521999990000" inputmode="numeric" aria-label="Número do cliente de teste">
    </div>
  </header>
  <p class="aviso">Teste grátis: nenhuma mensagem real é enviada. Escreva "oi" para começar.</p>
  <div id="conversa" role="log" aria-live="polite"></div>
  <form id="form">
    <input id="texto" autocomplete="off" placeholder="Digite uma mensagem" aria-label="Mensagem">
    <button type="submit">Enviar</button>
  </form>
</main>
<script>
(function () {
  var sel = document.getElementById('negocio'), num = document.getElementById('numero');
  var conversa = document.getElementById('conversa'), texto = document.getElementById('texto');

  function desenhar(linhas) {
    conversa.textContent = '';
    linhas.forEach(function (l) {
      var d = document.createElement('div');
      d.className = 'balao ' + (l.de === 'cliente' ? 'cliente' : 'robo');
      d.textContent = l.texto;
      conversa.appendChild(d);
    });
    conversa.scrollTop = conversa.scrollHeight;
  }

  function carregar() {
    if (!sel.value) return;
    fetch('/simulador/' + encodeURIComponent(sel.value) + '/' + encodeURIComponent(num.value) + '/historico')
      .then(function (r) { return r.json(); }).then(desenhar);
  }

  fetch('/simulador/negocios').then(function (r) { return r.json(); }).then(function (lista) {
    lista.forEach(function (n) { var o = document.createElement('option'); o.value = n.id; o.textContent = n.nome; sel.appendChild(o); });
    carregar();
  });
  sel.addEventListener('change', carregar);
  num.addEventListener('change', carregar);

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var t = texto.value.trim();
    if (!t) return;
    texto.value = '';
    fetch('/simulador/' + encodeURIComponent(sel.value) + '/mensagens', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ numero: num.value, texto: t })
    }).then(function (r) { return r.json(); }).then(desenhar);
  });
})();
</script>
</body>
</html>
